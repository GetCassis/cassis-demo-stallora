name: cassis ontology

# Pull requests run the same gates you run locally with `cassis verify`.
# Merging to main publishes, by whichever route applies to you:
#   - not connected in Cassis (the template default): the `publish` job below
#     uploads it.
#   - repository connected in Cassis (GitHub App): the git-sync webhook
#     publishes the merge — delete the `publish` job, or a merge can record a
#     redundant extra version.
#
# Everything is gated on CASSIS_API_KEY existing, so a repository created from
# this template sits quiet until you add the secret rather than greeting you
# with a failed run.

on:
  pull_request:
    paths: ["cassis/**"]
  push:
    branches: [main]
    paths: ["cassis/**"]

env:
  # Every command below needs the key, including the local-only ones: the CLI
  # exits 2 without it even when it is not talking to a project.
  CASSIS_API_KEY: ${{ secrets.CASSIS_API_KEY }}
  CASSIS_PROJECT_ID: ${{ vars.CASSIS_PROJECT_ID }}

jobs:
  # `secrets` is not readable from a job-level `if`, so detect the key here and
  # let the real jobs depend on the answer.
  configured:
    name: credentials present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        run: |
          if [ -z "$CASSIS_API_KEY" ]; then
            echo "::error::CASSIS_API_KEY is not set, so the ontology and eval checks below cannot run and merging will not publish. Add it as an Actions secret and CASSIS_PROJECT_ID as an Actions variable — setup step 5 in the README."
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

  check:
    name: ontology validation
    needs: configured
    if: needs.configured.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cassis-cli==1.5.0
      - name: cassis ontology fmt --check
        run: cassis ontology fmt --check
      - name: cassis ontology check
        run: cassis ontology check

  eval:
    name: eval suite
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cassis-cli==1.5.0
      - name: cassis eval run
        env:
          RUN_LABEL: PR ${{ github.event.number }} ${{ github.head_ref }}
        run: cassis eval run --label "$RUN_LABEL"

  publish:
    name: publish to Cassis
    # Only needed when the repository is NOT connected to the project in Cassis.
    # Harmless if it is: the webhook's import no-ops on an unchanged tree.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cassis-cli==1.5.0
      - name: cassis ontology upload
        run: cassis ontology upload
